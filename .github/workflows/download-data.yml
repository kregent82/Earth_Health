name: Stáhnout ověřená data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Stáhnout HadCRUT5
        run: python scripts/download_hadcrut.py

      - name: Stáhnout globální CO₂
        run: python scripts/download_co2.py

      - name: Stáhnout globální CH₄ a N₂O
        run: python scripts/download_ch4_n2o.py

      - name: Stáhnout zářijový rozsah arktického ledu
        run: python scripts/download_arctic_sea_ice.py

      - name: Stáhnout společenské ukazatele
        run: python scripts/download_social_indicators.py

      - name: Stáhnout obsah tepla v oceánu
        run: python scripts/download_ocean_heat.py

      - name: Uložit data do repozitáře
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Žádné změny dat."
          else
            git commit -m "Aktualizovat klimatická data"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: klimaticka-data
          path: data/
