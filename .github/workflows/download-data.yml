name: Stáhnout ověřená data

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/download_hadcrut.py
      - uses: actions/upload-artifact@v4
        with:
          name: hadcrut5-data
          path: data/hadcrut5/